<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
.ad{position:relative;width:1080px;overflow:hidden;background:#000;color:#fff;font-family:Inter,sans-serif}
.photo{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.fade{position:absolute;left:0;right:0;top:0}
.bfade{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6))}
.copy{position:absolute;left:80px;right:80px}
.eyebrow{font-size:26px;letter-spacing:.32em;font-weight:500;opacity:.9}
h1{font-family:"Inter Display",Inter,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:.98;margin-top:22px}
p{font-size:34px;line-height:1.4;margin-top:26px;opacity:.95}
.tags{position:absolute;left:80px;right:80px;display:flex;gap:14px;flex-wrap:wrap}
.tag{background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:14px 26px;font-size:24px;font-weight:600;letter-spacing:.08em}
</style></head><body><div class="ad" id="ad"></div><script>
const q=new URLSearchParams(location.search),H=+q.get('h'),v=q.get('v');
const ad=document.getElementById('ad');ad.style.height=H+'px';
const story=H>=1900,sq=H<=1080,T=story?260:sq?70:90;
const img=story?'photo-story.jpg':sq?'photo-square.jpg':'photo-feed.jpg';
const C={A:{h:'Up to 20% off.',p:'New guitars, amps and pedals. The price drops in your cart. No code, free shipping.'},
 B:{h:'Add to cart.<br>Watch it drop.',p:'Up to 20% off new guitars, amps and pedals. No code needed, and shipping is free.'}}[v];
const hs=sq?(v=='B'?92:116):story?(v=='B'?110:118):(v=='B'?112:140);
const TAGS='<div class="tags"><span class="tag">NO CODE</span><span class="tag">FREE SHIPPING</span></div>';
const fadeH=sq?560:story?1100:700;
ad.innerHTML=`<div class="photo" style="background-image:url(${img});${story?'background-size:114% auto;background-position:center top':''}"></div>
<div class="fade" style="height:${fadeH}px;background:linear-gradient(#000 0%,rgba(0,0,0,.92) ${story?45:40}%,rgba(0,0,0,.55) 72%,rgba(0,0,0,0) 100%)"></div>
<div class="bfade" style="height:${story?600:260}px"></div>
<div class="copy" style="top:${T}px;${story?'right:180px':''}"><div class="eyebrow">BLACK FRIDAY WEEKEND</div>
<h1 style="font-size:${hs}px">${C.h}</h1><p style="${sq?'font-size:30px;max-width:880px':''}">${C.p}</p>${story?TAGS.replace('class="tags"','class="tags" style="position:static;margin-top:34px"'):''}</div>
<div class="tags" style="bottom:60px;${story?'display:none':''}"><span class="tag">NO CODE</span><span class="tag">FREE SHIPPING</span>${sq?'':'<span class="tag">GUITARS · AMPS · PEDALS</span>'}</div>`;
</script></body></html>
