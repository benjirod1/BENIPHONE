<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
.ad{position:relative;width:1080px;overflow:hidden;background:#000;color:#fff;font-family:Inter,sans-serif}
.photo{position:absolute;left:0;right:0;bottom:0;background:url(guitar.png) right bottom/cover no-repeat}
.fade{position:absolute;left:0;right:0;background:linear-gradient(#000 0%,rgba(0,0,0,.85) 35%,rgba(0,0,0,0) 100%)}
.copy{position:absolute;left:80px;right:80px}
.eyebrow{font-size:26px;letter-spacing:.32em;font-weight:500;opacity:.9}
h1{font-family:"Inter Display",Inter,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:.98;margin-top:22px}
p{font-size:34px;line-height:1.4;font-weight:400;margin-top:26px;opacity:.92}
.pills{display:flex;gap:18px;margin-top:40px}
.pill{border:3px solid #fff;border-radius:999px;padding:24px 42px;font-size:26px;font-weight:700;letter-spacing:.16em}
.pill.solid{background:#fff;color:#000}
.tags{position:absolute;left:80px;right:80px;display:flex;gap:14px;flex-wrap:wrap}
.tag{background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:14px 26px;font-size:24px;font-weight:600;letter-spacing:.08em}
</style></head><body>
<div class="ad" id="ad"></div>
<script>
const q=new URLSearchParams(location.search), H=+q.get('h'), v=q.get('v');
const ad=document.getElementById('ad'); ad.style.height=H+'px';
const story=H>=1900, sq=H<=1080;
const T=story?260:sq?80:100;
const C={
 A:{eye:'BLACK FRIDAY WEEKEND',h:'Up to 20% off.',p:'New guitars, amps and pedals. The price drops in your cart. No code, free shipping.'},
 B:{eye:'BLACK FRIDAY WEEKEND',h:'Add to cart.<br>Watch it drop.',p:'Up to 20% off new guitars, amps and pedals. No code needed, and shipping is free.'}
}[v];
const hs=sq?(v=='B'?96:120):(v=='B'?112:140);
const photoH=sq?640:story?1100:820;
ad.innerHTML=`
 <div class="photo" style="height:${photoH}px"></div>
 <div class="fade" style="top:${H-photoH-2}px;height:${sq?260:340}px"></div>
 <div class="copy" style="top:${T}px">
  <div class="eyebrow">${C.eye}</div>
  <h1 style="font-size:${hs}px">${C.h}</h1>
  <p style="${sq?'font-size:30px;max-width:860px':''}">${C.p}</p>
  ${sq?'':`<div class="pills"><div class="pill solid">SHOP 20% OFF</div><div class="pill">SHOP 15% OFF</div></div>`}
 </div>
 <div class="tags" style="bottom:${story?380:60}px">
  <span class="tag">NO CODE</span><span class="tag">FREE SHIPPING</span>${sq?'':'<span class="tag">GUITARS · AMPS · PEDALS</span>'}
 </div>`;
</script></body></html>
